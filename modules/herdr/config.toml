# herdr configuration — generated for this dotfiles repo.
#
# Schema verified against `herdr --default-config` (herdr 0.9.1, via
# `nix run nixpkgs#herdr -- --default-config`). Only the keys below are set;
# everything else keeps herdr's built-in default.

[theme]
# Native built-in theme — no manual color table needed (confirmed via
# `herdr --default-config`: built-ins include catppuccin, terminal,
# tokyo-night, dracula, nord, gruvbox, one-dark, solarized, kanagawa,
# rose-pine, vesper). "catppuccin" is the dark (mocha) variant; the light
# counterpart is "catppuccin-latte".
name = "catppuccin"

[keys]
# tmux-style prefix (tmux users commonly remap ctrl+b -> ctrl+a); herdr's
# own default prefix-mode bindings (split_vertical = prefix+v,
# split_horizontal = prefix+minus, detach = prefix+q, new_tab = prefix+c,
# zoom = prefix+z, ...) already mirror tmux's, so only the prefix itself
# needs to change.
prefix = "ctrl+a"

# Agent-sidebar navigation, matching Gentleman.Dots'
# https://github.com/Gentleman-Programming/Gentleman.Dots/blob/nix-migration/herdr/config-base.toml
# Avoids herdr's built-in prefix+shift+j/k pane-swap bindings.
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"
focus_agent = "prefix+ctrl+1..9"

# Vim-aware ctrl+h/j/k/l pane navigation via smart-splits.nvim's official
# herdr plugin (herdr-plugin.toml + scripts/herdr-navigate.sh, vendored at
# ~/.local/share/nvim/lazy/smart-splits.nvim). type = "plugin_action" runs
# synchronously in herdr (unlike type = "shell", which is detached/async and
# raced with focus changes) — see README.md "#### Herdr" section. Requires
# `herdr plugin link ~/.local/share/nvim/lazy/smart-splits.nvim` to be run
# once (see modules/herdr.nix activation script).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"
